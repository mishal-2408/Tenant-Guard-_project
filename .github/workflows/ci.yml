name: TenantGuard CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Frontend Build & Workspace Linting
  # ---------------------------------------------------------------------------
  build-and-lint:
    name: Frontend Build & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Workspace Lint Checks
        run: npm run lint

      - name: Build Frontend Client (Vite Production Bundle)
        run: npm run build --workspace=client

  # ---------------------------------------------------------------------------
  # Job 2: Backend Integration & Security Tests with MongoDB Service
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend Security & Multi-Tenant Isolation Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5001
      MONGODB_URI: mongodb://127.0.0.1:27017/tenantguard_ci_test
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/tenantguard_ci_test
      JWT_ACCESS_SECRET: ci_test_super_secret_jwt_access_key_32_characters_minimum!
      JWT_REFRESH_SECRET: ci_test_super_secret_jwt_refresh_key_32_characters_min!
      COOKIE_SECRET: ci_test_super_secret_cookie_signing_key_32_characters!
      MFA_ENCRYPTION_KEY: ci_test_mfa_encryption_key_32chars!
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Security Test Suites (Jest & Supertest)
        run: npm test --workspace=server

      - name: Verify Seed Demo Script Execution
        run: node server/src/scripts/seedDemo.js
